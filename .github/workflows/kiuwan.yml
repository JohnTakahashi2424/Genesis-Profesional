name: Kiuwan Security Analysis

on:
  push:
    branches:
      - Testing
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Testing

jobs:
  kiuwan-scan:
    name: Ejecutar Kiuwan Local Analyzer
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java JDK (requisito del Local Analyzer)
      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3. Descargar el Kiuwan Local Analyzer
      - name: Descargar Kiuwan Local Analyzer
        run: |
          curl -fSL -o KiuwanLocalAnalyzer.zip \
            "https://www.kiuwan.com/pub/analyzer/KiuwanLocalAnalyzer.zip"
          unzip -q KiuwanLocalAnalyzer.zip -d "$HOME/kiuwan"
          chmod +x "$HOME/kiuwan/KiuwanLocalAnalyzer/bin/agent.sh"

      # 4. Ejecutar el análisis
      - name: Ejecutar análisis en Kiuwan
        env:
          KIUWAN_USER: ${{ secrets.KIUWAN_USER }}
          KIUWAN_PASS: ${{ secrets.KIUWAN_PASS }}
        run: |
          "$HOME/kiuwan/KiuwanLocalAnalyzer/bin/agent.sh" \
            -n "Genesis-Profesional" \
            -s "${{ github.workspace }}" \
            -l "${{ github.run_number }}" \
            -wr \
            --user "$KIUWAN_USER" \
            --pass "$KIUWAN_PASS" \
            --exclude-patterns "**/node_modules/**,**/vendor/**,**/public/storage/**,**/storage/framework/**"
