name: Kiuwan Security Analysis

on:
  push:
    branches:
      - Testing
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Testing

jobs:
  kiuwan-scan:
    name: Ejecutar Kiuwan Local Analyzer
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java JDK (Requisito indispensable para Kiuwan)
      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3. Descargar y ejecutar el escáner con la integración nativa por comandos
      - name: Ejecutar Análisis de Código en Kiuwan
        uses: kiuwan/github-actions@v1
        with:
          userid: ${{ secrets.KIUWAN_USER }}
          password: ${{ secrets.KIUWAN_PASS }}
          softwareName: "Genesis-Profesional"
          sourcePath: ${{ github.workspace }}
          additionalParameters: "--exclude **/node_modules/**,**/vendor/**,**/public/storage/**,**/storage/framework/**"
